<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Belgian Car Sale Contract Verifier</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;font-size:14px;padding:24px 20px;max-width:1100px;margin:0 auto;line-height:1.5}
h1{font-size:21px;font-weight:700;margin-bottom:4px}
.subtitle{font-size:12px;opacity:.5;margin-bottom:28px}
section{margin-bottom:28px}
.section-title{font-size:13px;font-weight:600;opacity:.6;text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px}
.card{border:1px solid rgba(128,128,128,.18);border-radius:10px;padding:18px}

/* Agent inputs */
.input-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.input-group label{display:block;font-size:11px;font-weight:600;opacity:.55;text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px}
.input-group input{width:100%;padding:9px 11px;border:1px solid rgba(128,128,128,.25);border-radius:7px;font-size:14px;font-family:inherit;background:transparent;color:inherit}
.input-group input:focus{outline:none;border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.12)}

/* Upload zones */
.doc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:10px}
.upload-zone{border:2px dashed rgba(128,128,128,.25);border-radius:9px;padding:15px 14px;text-align:center;position:relative;cursor:pointer;transition:border-color .15s,background .15s;min-height:100px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.upload-zone:hover{border-color:#3b82f6;background:rgba(59,130,246,.04)}
.upload-zone.has-file{border-style:solid;border-color:#22c55e;background:rgba(34,197,94,.04)}
.upload-zone.drag-over{border-color:#3b82f6;background:rgba(59,130,246,.07)}
.upload-zone input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.uz-icon{font-size:22px;line-height:1}
.uz-name{font-weight:600;font-size:13px}
.uz-desc{font-size:11px;opacity:.45}
.uz-fname{font-size:11px;color:#16a34a;font-weight:500;margin-top:2px;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.uz-multi-hint{font-size:10px;opacity:.45;margin-top:2px}

/* Run button */
#verify-btn{width:100%;padding:13px;background:#1d4ed8;color:#fff;border:none;border-radius:9px;font-size:15px;font-weight:600;cursor:pointer;margin-bottom:28px;display:flex;align-items:center;justify-content:center;gap:8px;transition:background .15s}
#verify-btn:hover{background:#1e40af}
#verify-btn:disabled{background:#94a3b8;cursor:not-allowed}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}

/* Results */
.overall-banner{padding:12px 16px;border-radius:8px;font-weight:700;font-size:14px;margin-bottom:20px;display:flex;align-items:center;gap:10px}
.overall-banner.pass{background:rgba(34,197,94,.12);color:#15803d;border:1px solid rgba(34,197,94,.3)}
.overall-banner.warn{background:rgba(234,179,8,.1);color:#92400e;border:1px solid rgba(234,179,8,.3)}
.overall-banner.fail{background:rgba(239,68,68,.1);color:#991b1b;border:1px solid rgba(239,68,68,.3)}
.banner-counts{font-size:12px;font-weight:400;opacity:.75;margin-left:auto}

.doc-result{margin-bottom:12px;border:1px solid rgba(128,128,128,.15);border-radius:9px;overflow:hidden}
.doc-result-header{padding:10px 14px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:13px;cursor:pointer;user-select:none}
.doc-result-header:hover{filter:brightness(.97)}
.doc-result-body{padding:10px 14px;border-top:1px solid rgba(128,128,128,.12)}
.checks{list-style:none;display:flex;flex-direction:column;gap:5px}
.checks li{font-size:12.5px;display:flex;gap:8px;align-items:flex-start}
.ci{flex-shrink:0;width:16px;text-align:center;line-height:1.5}
.cl{flex:1}
.cl strong{font-weight:600}

/* Status colors for doc headers */
.dh-pass{background:rgba(34,197,94,.08)}
.dh-warn{background:rgba(234,179,8,.1)}
.dh-fail{background:rgba(239,68,68,.09)}
.dh-skip{background:rgba(128,128,128,.07)}

/* OCR toggle */
.ocr-row{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:12px;opacity:.7}
.ocr-row input[type=checkbox]{width:14px;height:14px;cursor:pointer}

/* Summary table */
.summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:16px}
.summary-card{padding:10px 14px;border-radius:7px;font-size:12px}
.summary-card .sc-label{opacity:.6;margin-bottom:2px}
.summary-card .sc-val{font-size:18px;font-weight:700}

/* Print */
@media print{#verify-btn,#doc-grid,#agent-section,.ocr-row{display:none}body{padding:0}section{margin-bottom:16px}}

/* Dark mode tweaks */
@media(prefers-color-scheme:dark){
  .input-group input{border-color:rgba(255,255,255,.2)}
  .doc-result{border-color:rgba(255,255,255,.1)}
  .doc-result-body{border-top-color:rgba(255,255,255,.1)}
  .overall-banner.pass{background:rgba(34,197,94,.15);color:#4ade80}
  .overall-banner.warn{background:rgba(234,179,8,.15);color:#fbbf24}
  .overall-banner.fail{background:rgba(239,68,68,.15);color:#f87171}
  .dh-pass{background:rgba(34,197,94,.12)}
  .dh-warn{background:rgba(234,179,8,.15)}
  .dh-fail{background:rgba(239,68,68,.12)}
}
</style>
</head>
<body>

<header>
  <h1>🚗 Belgian Car Sale Contract Verifier</h1>
  <p class="subtitle">Enter client details manually, upload documents, then run automated verification</p>
</header>

<!-- Agent Inputs -->
<section id="agent-section">
  <div class="section-title">Agent Input — Client Details</div>
  <div class="card">
    <div class="input-grid">
      <div class="input-group">
        <label>Client Name *</label>
        <input type="text" id="client-name" placeholder="e.g., Jan De Smet" autocomplete="off">
      </div>
      <div class="input-group">
        <label>VIN *</label>
        <input type="text" id="vin" placeholder="e.g., VF37J9HXCAJ716889" autocomplete="off" style="text-transform:uppercase">
      </div>
      <div class="input-group">
        <label>License Plate *</label>
        <input type="text" id="plate" placeholder="e.g., 1CFI968" autocomplete="off" style="text-transform:uppercase">
      </div>
      <div class="input-group">
        <label>IBAN *</label>
        <input type="text" id="iban" placeholder="e.g., BE68 5390 0754 7034" autocomplete="off">
      </div>
    </div>
    <div class="ocr-row">
      <input type="checkbox" id="ocr-toggle">
      <label for="ocr-toggle">Enable OCR for scanned/image-based PDFs (slower — loads Tesseract.js)</label>
    </div>
  </div>
</section>

<!-- Documents -->
<section>
  <div class="section-title">Documents</div>
  <div class="doc-grid" id="doc-grid"></div>
</section>

<button id="verify-btn">▶ Run Verification</button>

<!-- Results -->
<section id="results" style="display:none">
  <div class="section-title">Verification Results</div>
  <div id="results-content"></div>
  <div style="text-align:right;margin-top:12px">
    <button onclick="window.print()" style="padding:7px 14px;border:1px solid rgba(128,128,128,.3);border-radius:6px;background:transparent;cursor:pointer;font-size:12px;font-family:inherit;color:inherit">🖨 Print / Save PDF</button>
  </div>
</section>

<script>
// ── PDF.js ────────────────────────────────────────────────────────────────────
pdfjsLib.GlobalWorkerOptions.workerSrc =
  'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

// ── Document types config ────────────────────────────────────────────────────
const DOC_TYPES = [
  { id:'handover', name:'Handover Protocol',       desc:'Koopovereenkomst / Contrat de vente',           icon:'📋', multiple:false },
  { id:'readapp',  name:'Read & Approved',          desc:'Gelezen en goedgekeurd / Lu et approuvé',       icon:'✍️', multiple:false },
  { id:'attest',   name:'Attestations',             desc:'3 attestations (1 multi-page PDF or 3 files)',  icon:'📑', multiple:true  },
  { id:'id',       name:'ID / Procura',             desc:'Identity card(s) + power of attorney (if any)', icon:'🪪', multiple:false },
  { id:'reg',      name:'Registration Certificate', desc:'Deel I+II / Partie I+II',                       icon:'📘', multiple:false },
  { id:'tech',     name:'Technical Control',        desc:'Keuringsbewijs / Contrôle technique',           icon:'🔧', multiple:false },
];

const uploadedFiles = {};

// ── Render upload zones ───────────────────────────────────────────────────────
function renderZones() {
  const grid = document.getElementById('doc-grid');
  grid.innerHTML = '';
  DOC_TYPES.forEach(doc => {
    const zone = document.createElement('div');
    zone.className = 'upload-zone';
    zone.id = 'zone-' + doc.id;
    zone.innerHTML = `
      <input type="file" id="file-${doc.id}" accept=".pdf,.jpg,.jpeg,.png,.tiff,.bmp" ${doc.multiple ? 'multiple' : ''}>
      <div class="uz-icon">${doc.icon}</div>
      <div class="uz-name">${doc.name}</div>
      <div class="uz-desc">${doc.desc}</div>
      ${doc.multiple ? '<div class="uz-multi-hint">Multiple files accepted</div>' : ''}
      <div class="uz-fname" id="fname-${doc.id}"></div>
    `;
    const input = zone.querySelector('input');
    const setFiles = fileList => {
      if (!fileList.length) return;
      uploadedFiles[doc.id] = doc.multiple ? fileList : fileList[0];
      zone.classList.add('has-file');
      const names = fileList.map(f => f.name).join(', ');
      document.getElementById('fname-' + doc.id).textContent = names.length > 55 ? names.slice(0,52) + '…' : names;
    };
    input.addEventListener('change', e => setFiles(Array.from(e.target.files)));
    zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag-over'); });
    zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
    zone.addEventListener('drop', e => {
      e.preventDefault(); zone.classList.remove('drag-over');
      setFiles(Array.from(e.dataTransfer.files));
    });
    grid.appendChild(zone);
  });
}

// ── PDF text extraction ───────────────────────────────────────────────────────
async function extractPages(file) {
  try {
    const buf = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
    const pages = [];
    for (let i = 1; i <= pdf.numPages; i++) {
      const pg = await pdf.getPage(i);
      const ct = await pg.getTextContent();
      pages.push(ct.items.map(it => it.str).join(' '));
    }
    return { pages, numPages: pdf.numPages };
  } catch(e) {
    return { pages: [], numPages: 0, error: e.message };
  }
}

// OCR via Tesseract (loaded on demand) ----------------------------------------
let tesseractReady = false;
async function loadTesseract() {
  if (window.Tesseract) { tesseractReady = true; return; }
  await new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
    s.onload = res; s.onerror = rej;
    document.head.appendChild(s);
  });
  tesseractReady = true;
}

async function ocrFile(file) {
  try {
    await loadTesseract();
    const { data: { text } } = await Tesseract.recognize(file, 'nld+fra+eng');
    return text;
  } catch(e) {
    return '';
  }
}

async function extractText(file, useOCR) {
  const { pages, numPages } = await extractPages(file);
  const joined = pages.join(' ');
  // If we got very little text and OCR is enabled, fall back to OCR
  if (useOCR && joined.trim().length < 80) {
    const ocrText = await ocrFile(file);
    if (ocrText.length > joined.length) return { pages: [ocrText], numPages: 1, fromOCR: true };
  }
  return { pages, numPages, fromOCR: false };
}

async function extractMultipleFiles(files, useOCR) {
  let allPages = [];
  for (const f of files) {
    const res = await extractText(f, useOCR);
    allPages = allPages.concat(res.pages);
  }
  return allPages;
}

// ── Text helpers ─────────────────────────────────────────────────────────────
const norm    = s => (s||'').toLowerCase().replace(/[\s\-\.,:;''""\u2019]/g,'');
const normIBAN= s => (s||'').toUpperCase().replace(/[\s\-]/g,'');

function has(haystack, needle) {
  if (!needle||!haystack) return false;
  return norm(haystack).includes(norm(needle));
}
function hasAny(haystack, arr) { return arr.some(n => has(haystack, n)); }

function nameMatch(text, name) {
  if (!name||!text) return false;
  const parts = name.trim().split(/\s+/).filter(p => p.length >= 3);
  if (!parts.length) return has(text, name);
  return parts.some(p => norm(text).includes(norm(p)));
}
function vinMatch(text, vin) {
  if (!vin||!text) return false;
  const v = vin.replace(/\s/g,'').toUpperCase();
  return text.toUpperCase().replace(/\s/g,'').includes(v);
}
function plateMatch(text, plate) {
  if (!plate||!text) return false;
  return norm(text).includes(norm(plate.replace(/[\s\-]/g,'')));
}
function ibanMatch(text, iban) {
  if (!iban||!text) return false;
  const in_ = normIBAN(iban);
  return text.toUpperCase().replace(/[\s\-]/g,'').includes(in_);
}

function detectLang(text) {
  const t = (text||'').toLowerCase();
  const nl = ['koopovereenkomst','koper','verkoper','voertuig','kenteken','gelezen','goedgekeurd','deel','bewijs','rijksregister','inschrijvingsbewijs'].filter(w=>t.includes(w)).length;
  const fr = ['contrat','acheteur','vendeur','véhicule','immatriculation','approuvé','partie','certificat','quittance','enregistrement'].filter(w=>t.includes(w)).length;
  return nl>=fr ? 'NL' : 'FR';
}

function findDates(text) {
  const pat = /\b(\d{1,2})[\/\.\-](\d{1,2})[\/\.\-](\d{4})\b/g;
  const out = [];
  let m;
  while ((m=pat.exec(text))!==null) {
    const d = new Date(+m[3], +m[2]-1, +m[1]);
    if (!isNaN(d) && d.getFullYear()>=2000 && d.getFullYear()<=2050) out.push({date:d,raw:m[0]});
  }
  return out;
}

// ── Check result helper ───────────────────────────────────────────────────────
const chk = (label,status,detail) => ({label,status,detail:detail||''});
// status: 'pass' | 'warn' | 'fail' | 'info'

const TODAY = new Date();

// ═══════════════════════════════════════════════════════════════════════════════
// VERIFICATION FUNCTIONS
// ═══════════════════════════════════════════════════════════════════════════════

// ── Handover Protocol ─────────────────────────────────────────────────────────
async function verifyHandover(file, name, vin, plate, useOCR) {
  if (!file) return { skipped:true, checks:[chk('File','info','No file uploaded')] };
  const { pages, fromOCR } = await extractText(file, useOCR);
  if (!pages.length) return { skipped:false, checks:[chk('Text extraction','fail','Could not read PDF')] };
  const all = pages.join(' ');
  const checks = [];

  if (fromOCR) checks.push(chk('Extraction method','info','Text extracted via OCR (scanned document)'));

  const lang = detectLang(all);
  checks.push(chk('Language','info', lang==='NL' ? 'Dutch (NL)' : 'French (FR)'));

  const isDoc = hasAny(all,['koopovereenkomst','contrat de vente','handover','protocol','purchase agreement','verkoopcontract']);
  checks.push(chk('Document type', isDoc?'pass':'warn', isDoc?'Handover Protocol / Koopovereenkomst identified':'Document type not clearly identified — verify manually'));

  checks.push(chk('Client name', nameMatch(all,name)?'pass':'fail', nameMatch(all,name)?`"${name}" found`:`"${name}" not found in document`));
  checks.push(chk('VIN', vinMatch(all,vin)?'pass':'fail', vinMatch(all,vin)?`${vin} found`:`${vin} not found`));
  checks.push(chk('License plate', plateMatch(all,plate)?'pass':'fail', plateMatch(all,plate)?`${plate} found`:`${plate} not found`));

  // Address: look for street types or Belgian postal code pattern
  const hasAddr = /\b\d{4}\s+[A-Za-z]/.test(all) ||
    hasAny(all.toLowerCase(),['straat','laan','weg','plein','avenue','rue ','boulevard','chemin','steenweg','dreef']);
  checks.push(chk('Address', hasAddr?'pass':'warn', hasAddr?'Address / postal code detected':'No clear address found — manual check'));

  const dates = findDates(all);
  checks.push(chk('Date(s) present', dates.length?'pass':'warn',
    dates.length ? `Found: ${dates.slice(0,4).map(d=>d.raw).join(', ')}` : 'No dates detected'));

  return { skipped:false, checks, lang };
}

// ── Read & Approved ───────────────────────────────────────────────────────────
async function verifyReadApproved(file, name, useOCR) {
  if (!file) return { skipped:true, checks:[chk('File','info','No file uploaded')] };
  const { pages, fromOCR } = await extractText(file, useOCR);
  if (!pages.length) return { skipped:false, checks:[chk('Text extraction','fail','Could not read PDF')] };
  const all = pages.join(' ');
  const checks = [];
  if (fromOCR) checks.push(chk('Extraction method','info','Text via OCR'));

  const hasNL = has(all,'gelezen en goedgekeurd') || has(all,'gelezengoedgekeurd') ||
                has(all,'gelezen&goedgekeurd') || /gelezen\s*[&en]+\s*goedgekeurd/i.test(all);
  const hasFR = has(all,'lu et approuvé') || has(all,'lu et approuve') ||
                has(all,'luetapprouvé') || /lu\s*et\s*approuv/i.test(all);

  if (hasNL || hasFR) {
    checks.push(chk('Phrase found','pass', hasNL?'"Gelezen en goedgekeurd" (NL) present':'"Lu et approuvé" (FR) present'));
  } else {
    checks.push(chk('Phrase found','fail',
      'Neither "gelezen en goedgekeurd" nor "lu et approuvé" found. ' +
      'If handwritten only (not searchable), manual verification required.'));
  }

  checks.push(chk('Client name', nameMatch(all,name)?'pass':'warn',
    nameMatch(all,name)?`"${name}" found`:`"${name}" not found — manual check if handwritten`));

  checks.push(chk('Signature','info','Visual signatures cannot be auto-verified — confirm handwritten signature is present'));

  return { skipped:false, checks };
}

// ── Attestations ──────────────────────────────────────────────────────────────
async function verifyAttestations(fileOrArr, name, vin, useOCR) {
  const missing = !fileOrArr || (Array.isArray(fileOrArr) && !fileOrArr.length);
  if (missing) return { skipped:true, checks:[chk('File','info','No file(s) uploaded')] };
  const flist = Array.isArray(fileOrArr) ? fileOrArr : [fileOrArr];
  const allPages = await extractMultipleFiles(flist, useOCR);
  const checks = [];

  if (!allPages.length) return { skipped:false, checks:[chk('Text extraction','fail','Could not read attestation PDF(s)')] };

  checks.push(chk('Files / pages','info',`${flist.length} file(s), ${allPages.length} page(s) extracted`));

  if (allPages.length < 3) {
    checks.push(chk('Page count','warn',`Expected 3 attestation pages, got ${allPages.length} — ensure all 3 attestations are uploaded`));
  } else {
    checks.push(chk('Page count','pass',`${allPages.length} page(s) — at least 3 found`));
  }

  const p = [allPages[0]||'', allPages[1]||'', allPages[2]||''];

  // Name on all pages
  const nameOK = p.map((pg,i) => ({i:i+1,ok:nameMatch(pg,name)}));
  const allName = nameOK.every(x=>x.ok);
  checks.push(chk('Client name on all pages', allName?'pass':'fail',
    allName ? `"${name}" on all pages` :
    `Missing on page(s): ${nameOK.filter(x=>!x.ok).map(x=>x.i).join(', ')}`));

  // VIN on all pages
  const vinOK = p.map((pg,i) => ({i:i+1,ok:vinMatch(pg,vin)}));
  const allVIN = vinOK.every(x=>x.ok);
  checks.push(chk('VIN on all pages', allVIN?'pass':'fail',
    allVIN ? `${vin} on all pages` :
    `Missing on page(s): ${vinOK.filter(x=>!x.ok).map(x=>x.i).join(', ')}`));

  // Dates on all pages
  const datesPerPage = p.map(pg => findDates(pg));
  const allDates = datesPerPage.every(d=>d.length>0);
  checks.push(chk('Dates on all pages', allDates?'pass':'warn',
    `P1: ${datesPerPage[0].map(d=>d.raw).join(',')||'none'} | P2: ${datesPerPage[1].map(d=>d.raw).join(',')||'none'} | P3: ${datesPerPage[2].map(d=>d.raw).join(',')||'none'}`));

  // Dates consistent across pages
  if (allDates) {
    const d1 = datesPerPage[0][0]?.raw, d2 = datesPerPage[1][0]?.raw, d3 = datesPerPage[2][0]?.raw;
    const consistent = d1===d2 && d2===d3;
    checks.push(chk('Dates consistent','pass', consistent ? `Same date across pages (${d1})` : `Dates differ: ${d1} | ${d2} | ${d3} — verify manually`));
  }

  // Price check
  const priceRe = /[€$£]\s*\d|\d\s*[€$]|\b(EUR|euro|prix|prijs|bedrag|montant|price)\b|\d{3,}[,\.]\d{2}\s*(EUR|€)?/i;
  const hasP = p.map(pg => priceRe.test(pg));
  checks.push(chk('Price on page 1', hasP[0]?'pass':'warn', hasP[0]?'Amount/price detected':'No price detected (check manually)'));
  if (allPages.length>=2) checks.push(chk('Price on page 2', hasP[1]?'pass':'warn', hasP[1]?'Amount/price detected':'No price detected'));
  if (allPages.length>=3) checks.push(chk('No price on page 3', !hasP[2]?'pass':'fail',
    !hasP[2]?'Correct — no price on page 3':'Price/amount found on page 3 — should not be present'));

  checks.push(chk('Signatures (2 per page)','info','Visual check required — confirm 2 signature boxes are signed on each attestation page'));

  return { skipped:false, checks };
}

// ── ID / Procura ──────────────────────────────────────────────────────────────
async function verifyIDProcura(file, name, vin, iban, useOCR) {
  if (!file) return { skipped:true, checks:[chk('File','info','No file uploaded')] };
  const { pages, fromOCR } = await extractText(file, useOCR);
  if (!pages.length) return { skipped:false, checks:[chk('Text extraction','fail','Could not read PDF')] };
  const all = pages.join(' ');
  const checks = [];
  if (fromOCR) checks.push(chk('Extraction method','info','Text via OCR'));

  checks.push(chk('Pages','info',`${pages.length} page(s)`));

  // Procura detection
  const hasProcura = hasAny(all.toLowerCase(),['procura','volmacht','procuration','mandataire','gemachtigde','mandaat','power of attorney','volmacht geeft','gevolmachtigde']);
  checks.push(chk('Document type','info', hasProcura ? 'Procura (Power of Attorney) detected' : 'Standard ID (no Procura detected)'));

  if (hasProcura) {
    // Two ID cards expected
    const idRefs = (all.match(/\b(identiteitskaart|carte\s*d['']identit|rijksregister|numéro\s*national|nationaal\s*nr|eId|ID\s*card|paspoort|passport|kaart\s*nr|nr\.\s*\d)/gi)||[]).length;
    checks.push(chk('2 ID cards (Procura)', idRefs>=2?'pass':'warn',
      idRefs>=2 ? `${idRefs} ID reference(s) found — OK` :
      `Only ${idRefs} ID reference(s) detected — 2 required. Manual check if IDs are image-only.`));

    checks.push(chk('VIN in Procura', vinMatch(all,vin)?'pass':'fail',
      vinMatch(all,vin)?`${vin} found in Procura`:`${vin} not found — must appear in power of attorney`));

    checks.push(chk('Proxy signature consistency','info','Visual check: confirm proxy signature in Procura matches signature on attestations and Handover Protocol'));
  }

  // Name in ID
  checks.push(chk('Client name in ID', nameMatch(all,name)?'pass':'fail',
    nameMatch(all,name)?`"${name}" found`:`"${name}" not found. Manual check required if ID is image-based.`));

  // IBAN
  checks.push(chk('IBAN match', ibanMatch(all,iban)?'pass':'fail',
    ibanMatch(all,iban) ?
      `IBAN ${iban} found` :
      `IBAN ${iban} not found. Note: the bank card holder's name does NOT need to match — only the IBAN number matters.`));

  checks.push(chk('Signature with rest of contract','info','Visual check: confirm one signature on Handover Protocol matches signatures on attestations'));

  return { skipped:false, checks };
}

// ── Registration Certificate ──────────────────────────────────────────────────
async function verifyRegistration(file, name, vin, plate, useOCR) {
  if (!file) return { skipped:true, checks:[chk('File','info','No file uploaded')] };
  const { pages, fromOCR } = await extractText(file, useOCR);
  if (!pages.length) return { skipped:false, checks:[chk('Text extraction','fail','Could not read PDF')] };
  const all = pages.join(' ');
  const checks = [];
  if (fromOCR) checks.push(chk('Extraction method','info','Text via OCR'));

  const lang = detectLang(all);
  checks.push(chk('Language','info', lang==='NL' ? 'Dutch (NL)' : 'French (FR)'));
  checks.push(chk('Pages','info',`${pages.length} page(s)`));

  // Both parts detection
  const has1 = hasAny(all,['deel i','deel 1','partie i','partie 1','part i','inschrijvingsbewijs','certificat d\'immatriculation','bewijs van inschrijving']);
  const has2 = hasAny(all,['deel ii','deel 2','partie ii','partie 2','part ii']);

  if (pages.length >= 2) {
    checks.push(chk('Both parts present','pass',
      `${pages.length} pages found — ${lang==='NL'?'Deel I + Deel II':'Partie I + Partie II'} assumed present`));
  } else if (has1 && has2) {
    checks.push(chk('Both parts present','pass','Part I and Part II both identified in document'));
  } else if (has1 || has2) {
    checks.push(chk('Both parts present','warn',
      `Only ${has1?'Part I':'Part II'} clearly identified — ensure both parts are included`));
  } else {
    checks.push(chk('Both parts present','warn','Could not clearly identify Part I / Part II — verify manually'));
  }

  checks.push(chk('Client name', nameMatch(all,name)?'pass':'fail', nameMatch(all,name)?`"${name}" found`:`"${name}" not found`));
  checks.push(chk('VIN', vinMatch(all,vin)?'pass':'fail', vinMatch(all,vin)?`${vin} found`:`${vin} not found`));
  checks.push(chk('License plate', plateMatch(all,plate)?'pass':'fail', plateMatch(all,plate)?`${plate} found`:`${plate} not found`));

  return { skipped:false, checks };
}

// ── Technical Control ─────────────────────────────────────────────────────────
async function verifyTechControl(file, vin, plate, useOCR) {
  if (!file) return { skipped:true, checks:[chk('File','info','No file uploaded')] };
  const { pages, fromOCR } = await extractText(file, useOCR);
  if (!pages.length) return { skipped:false, checks:[chk('Text extraction','fail','Could not read PDF')] };
  const all = pages.join(' ');
  const checks = [];
  if (fromOCR) checks.push(chk('Extraction method','info','Text via OCR'));

  checks.push(chk('VIN', vinMatch(all,vin)?'pass':'fail', vinMatch(all,vin)?`${vin} found`:`${vin} not found`));
  checks.push(chk('License plate', plateMatch(all,plate)?'pass':'fail', plateMatch(all,plate)?`${plate} found`:`${plate} not found`));

  // Find expiry date
  let expiryDate = null;
  const expiryKeyRe = /geldig\s*tot|valable\s*jusqu|vervaldatum|date\s*(?:d['']expiration|limite)|geldig\s*t\/m|expir|keuring\s*geldig/i;

  // Split into pseudo-lines and find expiry-related context
  const sentences = all.split(/[\n\r]|(?<=[?!.])\s/).map(s=>s.trim()).filter(Boolean);
  for (const sen of sentences) {
    if (expiryKeyRe.test(sen)) {
      const ds = findDates(sen);
      if (ds.length) { expiryDate = ds[ds.length-1].date; break; }
    }
  }

  // Fallback: latest plausible date in document
  if (!expiryDate) {
    const allDates = findDates(all).filter(d => d.date.getFullYear()>=2023 && d.date.getFullYear()<=2035);
    if (allDates.length) {
      allDates.sort((a,b)=>b.date-a.date);
      expiryDate = allDates[0].date;
    }
  }

  if (!expiryDate) {
    checks.push(chk('Expiry date','warn','Could not auto-detect expiry date — manual check required'));
  } else {
    const diffMs = expiryDate.getTime() - TODAY.getTime();
    const diffDays = Math.round(diffMs / 86400000);
    const fmt = expiryDate.toLocaleDateString('en-GB');
    if (diffMs > 0) {
      checks.push(chk('Expiry date','pass',`Valid until ${fmt} (${diffDays} days remaining)`));
    } else {
      const expDays = Math.abs(diffDays);
      const expYears = expDays / 365;
      if (expYears < 1) {
        checks.push(chk('Expiry date','warn',`Expired ${fmt} (${expDays} days ago — less than 1 year: flagged but OK)`));
      } else {
        checks.push(chk('Expiry date','fail',`Expired ${fmt} (${(expYears).toFixed(1)} years ago — more than 1 year: NOT OK)`));
      }
    }
  }

  const allD = findDates(all);
  if (allD.length) checks.push(chk('All dates in document','info', allD.map(d=>d.raw).join(' | ')));

  return { skipped:false, checks };
}

// ═══════════════════════════════════════════════════════════════════════════════
// RENDER RESULTS
// ═══════════════════════════════════════════════════════════════════════════════
const STATUS_ICON = { pass:'✅', warn:'⚠️', fail:'🚩', info:'ℹ️' };
const DOC_LABELS = {
  handover:'Handover Protocol', readapp:'Read & Approved', attest:'Attestations',
  id:'ID / Procura', reg:'Registration Certificate', tech:'Technical Control'
};
const DOC_ICONS = { handover:'📋', readapp:'✍️', attest:'📑', id:'🪪', reg:'📘', tech:'🔧' };

function sectionStatus(result) {
  if (result.skipped) return 'skip';
  const c = result.checks||[];
  if (c.some(x=>x.status==='fail')) return 'fail';
  if (c.some(x=>x.status==='warn')) return 'warn';
  return 'pass';
}

function renderResults(results) {
  const container = document.getElementById('results-content');
  container.innerHTML = '';

  // Overall banner
  const allChecks = Object.values(results).flatMap(r=>r.checks||[]);
  const fails = allChecks.filter(c=>c.status==='fail').length;
  const warns = allChecks.filter(c=>c.status==='warn').length;
  const passes = allChecks.filter(c=>c.status==='pass').length;
  const overall = fails>0?'fail':warns>0?'warn':'pass';

  const banner = document.createElement('div');
  banner.className = 'overall-banner ' + overall;
  banner.innerHTML = `
    <span>${overall==='pass'?'✅ All checks passed':overall==='warn'?'⚠️ Review required':'🚩 Errors found'}</span>
    <span class="banner-counts">${passes} passed · ${warns} warnings · ${fails} errors</span>
  `;
  container.appendChild(banner);

  // Per-document sections
  for (const [id, result] of Object.entries(results)) {
    const st = sectionStatus(result);
    const stIcon = {pass:'✅',warn:'⚠️',fail:'🚩',skip:'—'}[st];
    const hdrClass = {pass:'dh-pass',warn:'dh-warn',fail:'dh-fail',skip:'dh-skip'}[st];

    const section = document.createElement('div');
    section.className = 'doc-result';

    const checks = result.checks||[];
    const bodyId = 'body-' + id;

    section.innerHTML = `
      <div class="doc-result-header ${hdrClass}" onclick="toggleSection('${bodyId}')">
        <span>${DOC_ICONS[id]||'📄'}</span>
        <span>${stIcon} ${DOC_LABELS[id]||id}</span>
        ${result.skipped ? '<span style="font-weight:400;opacity:.5;font-size:11px;margin-left:auto">Not uploaded</span>' : ''}
        <span style="margin-left:auto;opacity:.4;font-size:11px">▾</span>
      </div>
      <div class="doc-result-body" id="${bodyId}">
        <ul class="checks">
          ${checks.map(c=>`
            <li>
              <span class="ci">${STATUS_ICON[c.status]||'•'}</span>
              <span class="cl"><strong>${escHtml(c.label)}:</strong> ${escHtml(c.detail)}</span>
            </li>
          `).join('')}
        </ul>
      </div>
    `;
    container.appendChild(section);
  }
}

function toggleSection(id) {
  const el = document.getElementById(id);
  if (el) el.style.display = el.style.display==='none' ? '' : 'none';
}

function escHtml(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ═══════════════════════════════════════════════════════════════════════════════
// MAIN
// ═══════════════════════════════════════════════════════════════════════════════
async function runVerification() {
  const name  = document.getElementById('client-name').value.trim();
  const vin   = document.getElementById('vin').value.trim().toUpperCase().replace(/\s/g,'');
  const plate = document.getElementById('plate').value.trim().toUpperCase();
  const iban  = document.getElementById('iban').value.trim();
  const useOCR = document.getElementById('ocr-toggle').checked;

  if (!name||!vin||!plate||!iban) {
    alert('Please fill in all four agent fields: Client Name, VIN, License Plate, and IBAN.');
    return;
  }

  const btn = document.getElementById('verify-btn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Verifying…';

  const results = {};
  try {
    results.handover = await verifyHandover(uploadedFiles.handover, name, vin, plate, useOCR);
    results.readapp  = await verifyReadApproved(uploadedFiles.readapp, name, useOCR);
    results.attest   = await verifyAttestations(uploadedFiles.attest, name, vin, useOCR);
    results.id       = await verifyIDProcura(uploadedFiles.id, name, vin, iban, useOCR);
    results.reg      = await verifyRegistration(uploadedFiles.reg, name, vin, plate, useOCR);
    results.tech     = await verifyTechControl(uploadedFiles.tech, vin, plate, useOCR);
  } catch(err) {
    alert('Verification error: ' + err.message);
    console.error(err);
  } finally {
    btn.disabled = false;
    btn.innerHTML = '▶ Run Verification';
  }

  document.getElementById('results').style.display = '';
  renderResults(results);
  document.getElementById('results').scrollIntoView({ behavior:'smooth' });
}

// Init
renderZones();
document.getElementById('verify-btn').addEventListener('click', runVerification);
</script>
